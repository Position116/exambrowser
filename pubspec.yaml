name: exam_brow
description: Kiosk exam browser untuk Windows, Android, dan iOS.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  window_manager: ^0.4.3
  shared_preferences: ^2.3.2
  package_info_plus: ^10.2.1
  dio: ^5.11.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
