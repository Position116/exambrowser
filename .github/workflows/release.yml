# Otomatis rilis: setiap kali tag v* di-push, GitHub Actions build APK
# dan publish GitHub Release. Aplikasi yang sudah terinstall akan
# menemukan update lewat checkForUpdate() di lib/update_service.dart.
name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Patch flutter_inappwebview_android for new AGP
        # AGP baru menolak proguard-android.txt bawaan plugin
        # (lihat work.md bagian 5 poin 5). Patch sama diterapkan di CI.
        run: |
          for d in "$HOME"/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*; do
            sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' "$d/android/build.gradle"
          done

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "exambrow-v${VERSION}-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "exambrow-v${VERSION}-armeabi-v7a.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            exambrow-v*-arm64-v8a.apk
            exambrow-v*-armeabi-v7a.apk
          generate_release_notes: true
